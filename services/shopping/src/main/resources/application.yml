spring:
  application.name: shopping
  datasource:
    driverClassName: org.postgresql.Driver
    hikari:
      maximumPoolSize: 15
  jpa:
    hibernate.ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.type.json_format_mapper: shop.shopping.tools.Jackson3JsonFormatMapper
  liquibase:
    change-log: classpath:db/db.changelog.yaml
  security:
    oauth2:
      resourceserver:
        jwt:
          # The environment always sets JWT_ISSUER_URI; the default is deliberately unresolvable (RFC 2606).
          issuer-uri: ${JWT_ISSUER_URI:https://keycloak.invalid/realms/shopping}

basket:
  # The one currency a basket holds (element 03 RULE-2, D21). The specification does not say what an empty, auto-created
  # basket is priced in, and the API reports a currency on exactly that basket (element 07, `basket` step 2 of the contract),
  # so the deployment states it here. It is decided once per basket: an offer in another currency is refused, never converted.
  currency: ${SHOPPING_BASKET_CURRENCY:PLN}

server:
  shutdown: graceful
  error:
    include-message: never

management:
  metrics.export.prometheus.enabled: true
  endpoint.env.enabled: true
  endpoints.web.exposure.include: "health,info,env,prometheus"

logging.level:
  org.apache.catalina.startup.DigesterFactory: ERROR
  org.apache.catalina.util.LifecycleBase: ERROR
  org.apache.coyote.http11.Http11NioProtocol: WARN
  org.apache.sshd.common.util.SecurityUtils: WARN
  org.apache.tomcat.util.net.NioSelectorPool: WARN
  org.eclipse.jetty.util.component.AbstractLifeCycle: ERROR
  org.hibernate.validator.internal.util.Version: WARN
  org.springframework.boot.actuate.endpoint.jmx: WARN
  org.springframework.web: INFO
