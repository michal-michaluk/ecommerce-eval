apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping
  labels:
    app: shopping
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping
  template:
    metadata:
      labels:
        app: shopping
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shopping
          image: shopping:latest
          # No registry in a local cluster: the image is imported into k3s with
          # `ctr -n k8s.io images import` and must never be pulled.
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Every ConfigMap key is kebab-case, so it cannot be an environment variable name and
          # `envFrom` would deliver nothing: each one is bound explicitly below. A key added to
          # base/configmap.yaml without an entry here is dead.
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: spring-profile-active
            - name: JWT_ISSUER_URI
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: JWT_ISSUER_URI
            - name: SHOPPING_BASKET_CURRENCY
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: SHOPPING_BASKET_CURRENCY
            - name: SHOPPING_BASKET_DELIVERY_RATE
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: basket-delivery-rate
            - name: SHOPPING_BASKET_DELIVERY_FREE_WHEN_SMART
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: basket-delivery-free-when-smart
            - name: SHOPPING_BASKET_ESTIMATE_FROM
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: basket-estimate-default-days-from
            - name: SHOPPING_BASKET_ESTIMATE_TO
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: basket-estimate-default-days-to
            - name: SHOPPING_BASKET_ESTIMATE_ZONE
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: basket-estimate-zone
            - name: SHOPPING_BASKET_ESTIMATE_FALLBACK
              valueFrom:
                configMapKeyRef:
                  name: shopping
                  key: basket-estimate-fallback
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: shopping-db
                  key: jdbc-url
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: shopping-db
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shopping-db
                  key: password
          # A cold JVM plus Liquibase takes well over a minute on a loaded machine; the startup
          # probe owns that wait so the liveness probe never restarts a container that is still
          # starting.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "1.5Gi"
              cpu: "1"
      volumes:
        - name: tmp
          emptyDir: {}
