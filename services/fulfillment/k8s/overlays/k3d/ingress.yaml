apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fulfillment
  namespace: fulfillment
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fulfillment
                port:
                  number: 80
