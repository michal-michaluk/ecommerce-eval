apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fulfillment

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

labels:
  - pairs:
      app: fulfillment
      managed-by: kustomize

images:
  - name: fulfillment
    newName: fulfillment
    newTag: latest

configMapGenerator:
  - name: fulfillment
    behavior: merge
    literals:
      - kafka-bootstrap-servers=kafka:9092
