apiVersion: v1
kind: Service
metadata:
  name: fulfillment-keycloak
  namespace: fulfillment
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: fulfillment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6.1
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 0
            allowPrivilegeEscalation: false
            # `start-dev` re-augments Quarkus into /opt/keycloak/lib/quarkus, overwriting the
            # jars shipped there, so this container cannot run on a read-only rootfs. An
            # emptyDir over that directory is not the answer either: it hides the shipped
            # quarkus-application.dat and Keycloak dies with NoSuchFileException.
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          args:
            - start-dev
            - --import-realm
          ports:
            - containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY
              value: edge
          startupProbe:
            httpGet:
              path: /realms/iot/.well-known/openid-configuration
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 15
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
            - name: realm-config
              mountPath: /opt/keycloak/data/import/iot-realm.json
              subPath: iot-realm.json
      volumes:
        - name: keycloak-data
          emptyDir: {}
        - name: realm-config
          configMap:
            name: keycloak-realm
