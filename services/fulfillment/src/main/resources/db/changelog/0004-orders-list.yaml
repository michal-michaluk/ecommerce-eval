databaseChangeLog:

  # The orders list of element 15: one row per current order, holding the facts its events carried. The state is stored as
  # the processing state's own name, so the list filters on a column and never opens a document; the word a client reads is
  # derived from it when the row is rendered.
  - changeSet:
      id: 0004-orders-list
      author: michal.michaluk
      changes:
        - createTable:
            tableName: orders_list
            columns:
              - column:
                  name: processing_id
                  type: varchar(32)
                  constraints:
                    primaryKey: true
                    primaryKeyName: orders_list_pkey
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: state
                  type: varchar(32)
                  constraints:
                    nullable: false
              - column:
                  name: assignee
                  type: varchar(255)
              - column:
                  name: recipient
                  type: varchar(255)
              - column:
                  name: placed_at
                  type: timestamptz
              - column:
                  name: positions_total
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: positions_packed
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: orders_list
            indexName: orders_list_placed_at_idx
            columns:
              - column:
                  name: placed_at
