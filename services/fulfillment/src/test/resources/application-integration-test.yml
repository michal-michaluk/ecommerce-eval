spring:
  jpa:
    show-sql: true
    hibernate.ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.type.json_format_mapper: shop.fulfillment.tools.Jackson3JsonFormatMapper
  liquibase:
    change-log: classpath:db/db.changelog.yaml
    drop-first: true
  # One Spring context per distinct test configuration, and the reused PostgreSQL container holds them all at once: a pool of
  # fifteen connections per context exhausts the container's connections before the suite is over. Two are enough for a test.
  datasource.hikari.maximum-pool-size: 2

# The carrier block a test deployment configures, so a scan can register its parcel (element 14, element 03). The credential is
# deliberately absent: without it no CarrierPort bean exists, and the suite wires its own double.
fulfillment:
  carrier:
    sender:
      street: ul. Mineralna 5
      city: Warszawa
      postal-code: 02-274
      country: PL

outbox:
  delay: PT0.1S
  batch: 1000
