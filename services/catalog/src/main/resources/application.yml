spring:
  application.name: catalog
  # 12 D18 — a request body is the components its command declares: an unknown component is `400 {errors[]}`. Service-wide, because
  # the servlet stack reads every body with Boot's mapper; the documents keep the lenient one (tools.JsonConfiguration).
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    driverClassName: org.postgresql.Driver
    hikari:
      maximumPoolSize: 15
  jpa:
    hibernate.ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate.type.json_format_mapper: shop.catalog.tools.Jackson3JsonFormatMapper
  liquibase:
    change-log: classpath:db/db.changelog.yaml
  kafka.consumer:
    group-id: catalog-default
    auto-offset-reset: earliest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://keycloak.auth/realms/iot}

catalog:
  events:
    topic: catalog.offer.events.v1
    bootstrap-servers: ${spring.kafka.bootstrap-servers:localhost:9092}
    payload: snapshot
  pricing:
    activation-interval: PT60S
    order: fixed-first
    stacking: stacked
  quality:
    min-prose-chars: 1000
    grammar:
      enabled: false
    required-parameters:
      - prefix: [Dziecko, Zabawki, Klocki, LEGO]
        parameters:
          condition: { value-type: text, required: true }
          childAge: { value-type: rangeFrom, required: true }
          pieceCount: { value-type: integer, required: true }
          gender: { value-type: enumSet, required: true }
          certificates: { value-type: list, required: true }
          safetyInfo: { value-type: text, required: true }

server:
  shutdown: graceful
  error:
    include-message: never

management:
  metrics.export.prometheus.enabled: true
  endpoint.env.enabled: true
  endpoints.web.exposure.include: "health,info,env,prometheus"

logging.level:
  org.apache.catalina.startup.DigesterFactory: ERROR
  org.apache.catalina.util.LifecycleBase: ERROR
  org.apache.coyote.http11.Http11NioProtocol: WARN
  org.apache.sshd.common.util.SecurityUtils: WARN
  org.apache.tomcat.util.net.NioSelectorPool: WARN
  org.eclipse.jetty.util.component.AbstractLifeCycle: ERROR
  org.hibernate.validator.internal.util.Version: WARN
  org.springframework.boot.actuate.endpoint.jmx: WARN
  org.springframework.web: INFO
  org.apache.kafka: WARN
  org.apache.kafka.clients.consumer.ConsumerConfig: INFO
  org.apache.kafka.clients.producer.ProducerConfig: INFO
  org.apache.kafka.clients.admin.AdminClientConfig: INFO
  org.apache.kafka.common.utils.AppInfoParser: INFO
  org.apache.kafka.streams.StreamsConfig: INFO
