apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalog

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

labels:
  - pairs:
      app: catalog
      managed-by: kustomize

images:
  - name: catalog
    newName: catalog
    newTag: latest

configMapGenerator:
  - name: catalog
    behavior: merge
    literals:
      - kafka-bootstrap-servers=kafka:9092
