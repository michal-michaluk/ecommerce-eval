apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: catalog

resources:
  - namespace.yaml
  - ingress.yaml
  - ../../base

patches:
  - path: deployment-patch.yaml

configMapGenerator:
  - name: catalog
    behavior: merge
    literals:
      - kafka-bootstrap-servers=catalog-kafka:9092
      - spring-profile-active=dev
      - JWT_ISSUER_URI=http://catalog-keycloak:8080/realms/iot

secretGenerator:
  - name: catalog-db
    literals:
      - jdbc-url=jdbc:postgresql://catalog-db-postgresql:5432/catalog
      - username=catalog
      - password=catalog
