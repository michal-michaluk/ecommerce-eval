plugins {
    id "org.springframework.boot" version "4.1.0"
    id "io.spring.dependency-management" version "1.1.7"
    id "java"
    id "com.google.cloud.tools.jib" version "3.5.4"
    id "jacoco"
    id "info.solidsoft.pitest" version "1.19.0"
    id "com.github.spotbugs" version "6.5.9"
}

group = "shop.catalog"
version = "1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-web"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.kafka:spring-kafka"
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"
    implementation "org.springframework.retry:spring-retry:2.0.13"
    implementation "io.micrometer:micrometer-registry-prometheus"
    runtimeOnly "org.postgresql:postgresql"
    implementation "org.springframework.boot:spring-boot-starter-liquibase"


    annotationProcessor "org.projectlombok:lombok:1.18.46"

    //Tests
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation("org.junit.platform:junit-platform-launcher:6.1.2") {
        because "Spring Boot 4.0.6 pins this to 1.14.2 which is incompatible with JUnit 6.0.3"
    }
    testImplementation "org.testcontainers:testcontainers:2.0.5"
    testImplementation "org.testcontainers:testcontainers-kafka:2.0.5"
    testImplementation "org.testcontainers:testcontainers-postgresql:2.0.5"
    testImplementation "org.awaitility:awaitility"
    testImplementation "au.com.dius.pact.consumer:junit5:4.7.3"
    testImplementation "au.com.dius.pact.provider:junit5spring:4.7.3"
    testImplementation "org.springframework.security:spring-security-test"
    testImplementation "org.springframework.boot:spring-boot-starter-webflux"
    testImplementation "com.github.dasniko:testcontainers-keycloak:4.3.1"
    testImplementation "com.tngtech.archunit:archunit-junit5:1.4.2"

    spotbugs "com.github.spotbugs:spotbugs:4.9.8"
    spotbugs "com.h3xstream.findsecbugs:findsecbugs-plugin:1.14.0"
}

configurations {
    compileOnly { extendsFrom annotationProcessor }
    testCompileOnly { extendsFrom annotationProcessor }
    testAnnotationProcessor { extendsFrom annotationProcessor }
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
    // P5 is its own task: the e2e suite boots the application and runs the whole prototype of 12, which costs minutes and
    // needs hurl — `./gradlew build` stays the second-scale gate of P1.
    exclude "**/e2e/**"
}

/**
 * P5 of the spec's Prove Definition of Done: the HTTP contract of 12 over a booted application.
 *
 * It is a Test task so the suite gets the same classpath, test runtime and Testcontainers config as every integration test: the
 * harness starts Postgres, Kafka and Keycloak itself, and `hurl --test` exits non-zero on any failing request, which fails this
 * task and therefore the build.
 */
tasks.register("e2eHurl", Test) {
    description = "Runs the element 12 contract (e2e/catalog-http-api.hurl) against the booted service"
    group = "verification"
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "**/e2e/**"
    systemProperty "catalog.e2e.suite", layout.projectDirectory.file("e2e/catalog-http-api.hurl").asFile.absolutePath
    outputs.upToDateWhen { false }
}

jacoco {
    toolVersion = "0.8.15"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

/**
 * P8 of the spec's Prove Definition of Done. The suites that boot a container — the e2e contract and everything annotated
 * `@IntegrationTest` — are proofs of 12's contract, not mutation targets: PIT replays the whole suite between mutants, so a suite
 * that starts Postgres, Kafka and Keycloak and drives hurl against them costs minutes per mutant and aborts the coverage phase.
 *
 * <p>The exclusion list is derived from the annotation instead of a hand-kept glob list, so a new integration suite is excluded by
 * declaring itself one — the match is on the annotation at the start of a line, so a suite that only mentions `@IntegrationTest` in
 * a javadoc is still mutated. PIT is 1.30.2 and not 1.25.4 because 1.25.4 rewrites a record into a class file whose `Record`
 * attribute the JVM cannot resolve: the minion died with `SIGSEGV` in `JVM_GetRecordComponents` the moment a test let Jackson
 * introspect that record, and no mutation score existed at all.
 */
def containerSuites = fileTree('src/test/java') { include '**/*.java' }
        .findAll { (it.text =~ /(?m)^@IntegrationTest\b/).find() }
        .collect { it.path.replace(File.separator, '/').replaceAll('^.*src/test/java/', '').replaceFirst('\\.java$', '').replace('/', '.') }

pitest {
    targetClasses = ["shop.catalog.*"]
    // The mutation targets are the domain and policy classes of the five contexts — the same bundle `jacocoTestCoverageVerification`
    // measures. The edges of a context (controllers, repositories, read projections, messaging adapters, listeners, configuration,
    // properties, the ports that name them) are proved by the container suites this task cannot run, and `tools`/`mediators` are
    // infrastructure the coverage bundle excludes as well, so mutating any of them would measure missing coverage instead of the
    // tests' strength.
    excludedClasses = ["shop.catalog.tools.*", "shop.catalog.mediators.*", "shop.catalog.ApiErrorAdvice",
                       "shop.catalog.CreatedResponseAdvice*", "shop.catalog.AppRunner",
                       "shop.catalog.*Controller*", "shop.catalog.*Repository*", "shop.catalog.*Projection*",
                       "shop.catalog.*Service*", "shop.catalog.*Integration*", "shop.catalog.*Listener*",
                       "shop.catalog.*Configuration*", "shop.catalog.*Properties*", "shop.catalog.*ConfigAdapter*",
                       "shop.catalog.*Snapshot*", "shop.catalog.*Registry*"]
    excludedTestClasses = ["shop.catalog.e2e.*"] + containerSuites
    pitestVersion = "1.30.2"
    threads = 4
    outputFormats = ["XML", "HTML"]
    timestampedReports = false
    junit5PluginVersion = "1.2.3"
}

spotbugs {
    ignoreFailures = false
    effort = "max"
    reportLevel = "medium"
    includeFilter = file("config/spotbugs/include.xml")
    excludeFilter = file("config/spotbugs/exclude.xml")
}

spotbugsMain {
    reports {
        html {
            required = true
            outputLocation = file("${buildDir}/reports/spotbugs/main.html")
        }
        sarif {
            required = true
            outputLocation = file("${buildDir}/reports/spotbugs/main.sarif")
        }
    }
}

spotbugsTest {
    reports {
        html {
            required = true
            outputLocation = file("${buildDir}/reports/spotbugs/test.html")
        }
    }
}

tasks.register("trivyScan", Exec) {
    dependsOn build
    description = "Run Trivy vulnerability scanner (requires Docker)"
    group = "Security"
    commandLine "docker", "run", "--rm",
        "-v", "${projectDir}:/project",
        "-v", "/var/run/docker.sock:/var/run/docker.sock",
        "aquasec/trivy:latest",
        "filesystem",
        "--scanners", "vuln,secret,misconfig",
        "--severity", "HIGH,CRITICAL",
        "--exit-code", "1",
        "/project"
}

tasks.register("trivyScanImage", Exec) {
    dependsOn jibDockerBuild
    description = "Scan the built Docker image with Trivy"
    group = "Security"
    commandLine "docker", "run", "--rm",
        "-v", "/var/run/docker.sock:/var/run/docker.sock",
        "aquasec/trivy:latest",
        "image",
        "--severity", "HIGH,CRITICAL",
        "--exit-code", "1",
        "catalog:latest"
}


jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    // Measure exactly what the gate claims to measure: the bounded contexts. The `onlyIf` below already
    // defines a context as a package that is neither `tools` nor `mediators`; without the same filter here
    // the bundle also counts the skeleton's infrastructure, so a context at 100 % can never reach 80 %.
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/tools/**', '**/mediators/**',
                    '**/AppRunner*', '**/AppConfiguration*', '**/*package-info*'
            ])
        }))
    }
    // The skeleton ships no business context, so there is nothing to cover yet. A context is a package under the root
    // that is neither `tools` nor `mediators`; while none exists the gate stays off instead of demanding 80% of nothing.
    onlyIf {
        fileTree("src/main/java") {
            include "**/*.java"
            exclude "**/tools/**", "**/mediators/**", "**/AppRunner.java", "**/AppConfiguration.java", "**/package-info.java"
        }.files
    }
    violationRules {
        rule {
            limit {
                counter = "INSTRUCTION"
                value = "COVEREDRATIO"
                minimum = 0.8
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification


compileJava {
    options.incremental = true
    options.compilerArgs << "-parameters"
    options.compilerArgs << "-Xlint:unchecked"
}

compileTestJava {
    options.incremental = true
    options.compilerArgs << "-parameters"
    options.compilerArgs << "-Xlint:unchecked"
}

def otelAgentVersion = "2.17.0"
def otelAgentDir = layout.buildDirectory.dir("otel")
def otelAgentJar = otelAgentDir.map { it.file("opentelemetry-javaagent.jar") }

tasks.register("downloadOtelAgent") {
    outputs.file(otelAgentJar)
    doLast {
        def targetDir = otelAgentDir.get().asFile
        targetDir.mkdirs()
        def jar = otelAgentJar.get().asFile
        if (!jar.exists()) {
            def url = "https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/download/v${otelAgentVersion}/opentelemetry-javaagent.jar"
            println "Downloading OTel Java agent v${otelAgentVersion}..."
            new URL(url).withInputStream { input -> jar.withOutputStream { output -> input.transferTo(output) } }
            println "Downloaded to ${jar}"
        }
    }
}

jib {
    from {
        image = "eclipse-temurin:25-jdk"
    }
    to {
        image = "catalog"
        tags = ["latest"]
    }
    extraDirectories {
        paths {
            path {
                from = otelAgentDir.get().asFile
                into = "/app"
            }
        }
    }
    container {
        mainClass = "shop.catalog.AppRunner"
        ports = ["8080"]
        jvmFlags = ["-XX:+UseZGC", "-XX:MaxRAMPercentage=75"]
        environment = [
            "SPRING_OUTPUT_ANSI_ENABLED": "never",
            "JAVA_TOOL_OPTIONS": "-javaagent:/app/opentelemetry-javaagent.jar"
        ]
        creationTime = "USE_CURRENT_TIMESTAMP"
    }
}

tasks.named("jib").configure { dependsOn "downloadOtelAgent" }
tasks.named("jibDockerBuild").configure { dependsOn "downloadOtelAgent" }
tasks.named("jibBuildTar").configure { dependsOn "downloadOtelAgent" }
