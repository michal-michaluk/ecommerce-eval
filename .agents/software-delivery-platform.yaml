# software-delivery-platform config for the ecommerce-eval repo.
# Read by the `software-delivery-platform` skill when the working directory is this repo.
# The enclosing workspace (bottega-ai-mind) keeps its own config at ../../.agents/.

default_platform: github
workspace: michal-michaluk # the GitHub account that owns this repo

platforms:
  github:
    cli: gh
    host: github.com
    users: [michal-michaluk]
    repos: [michal-michaluk/ecommerce-eval]

conventions:
  worklog: comment # where work session data lands: comment | body-section | label | custom-field
  worklog_fields: [tokens, model]

git:
  base_branch: main # PR base + origin of the feature branch
  feature_branch_prefix: feat # feature branch: <prefix>/<slug>
  wip_branch_prefix: wip # unrelated-WIP parking branch: <prefix>/pre-<ts>
  commit_scope: auto # monorepo: node OUT subtrees only

pr:
  draft: false
  labels: []
  include_video: true

labels:
  triage:
    bug: bug
    enhancement: enhancement
    needs-triage: needs-triage
    needs-info: needs-info
    ready-for-agent: ready-for-agent
    ready-for-human: ready-for-human
    wontfix: wontfix
