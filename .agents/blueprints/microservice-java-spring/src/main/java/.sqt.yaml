version: 1

# Classifications, kept in one file for now (no includes yet).
# Every member predicate is scoped to the type's own body (`field: body` +
# `stopBy: neighbor`), so a nested type's members never classify the outer type.
utils:
  # A member predicate: the type's own body declares an `id` / `*Id` field.
  has.id:
    has:
      field: body
      stopBy: neighbor
      kind: class_body
      has:
        stopBy: neighbor
        kind: field_declaration
        has:
          stopBy: end
          kind: variable_declarator
          has: { field: name, stopBy: end, kind: identifier, regex: '(^id$|Id$)' }

  # A member predicate: the type's own body declares at least one mutable
  # instance field (neither `final` nor `static`).
  is.mutable:
    has:
      field: body
      stopBy: neighbor
      kind: class_body
      has:
        stopBy: neighbor
        kind: field_declaration
        not: { has: { stopBy: end, kind: modifiers, regex: '\b(final|static)\b' } }

  # An ENTITY is a class with identity and mutable state. It may be nested —
  # e.g. a part of an aggregate — so it is not restricted to top level. No check
  # rides on it yet; it only classifies, so persistence rows (`*Entity`) are fine.
  is.entity:
    all:
      - kind: class_declaration
      - matches: has.id
      - matches: is.mutable

  # A class that collects domain events in a `List<*Event> events` field.
  has.events:
    has:
      field: body
      stopBy: neighbor
      kind: class_body
      has:
        stopBy: neighbor
        kind: field_declaration
        all:
          - has:
              stopBy: end
              kind: variable_declarator
              has: { field: name, stopBy: end, kind: identifier, regex: '[Ee]vents$' }
          - has:
              field: type
              stopBy: end
              kind: generic_type
              has: { stopBy: end, kind: type_identifier, regex: 'Event$' }

  # A declaration at the file's top level — its immediate parent is the
  # file-root node (`program`). The positive form of "not nested".
  is.top-level:
    inside: { stopBy: neighbor, kind: program }

  # An AGGREGATE is a top-level entity that collects domain events.
  # An aggregate is a class with its own id and a domain-event buffer. Deliberately NOT keyed on
  # `is.entity` (which requires `is.mutable`): an immutable editor would silently skip all thirteen
  # `aggregate.*` checks. Same fix as eval/ecommerce services/catalog (commit 84bb802).
  is.aggregate:
    all:
      - kind: class_declaration
      - matches: has.id
      - matches: is.top-level
      - matches: has.events

  # A VALUE OBJECT is a record, or a Lombok @Value class.
  is.valueobject:
    any:
      - kind: record_declaration
      - all:
          - kind: class_declaration
          - has: { stopBy: end, pattern: '@Value' }

  # ==================== Aggregate member predicates ========================
  # Method-grain classifications. They compose into the four kinds of aggregate
  # member the documentation names: command handler, projection (snapshot or
  # query), invariant, and utility helper.

  # A method declared in an aggregate's OWN body — never in a nested type.
  is.aggregate-method:
    all:
      - kind: method_declaration
      - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.aggregate } }

  # An INVARIANT: a rule method that throws on violation (`if (…) throw …`).
  # Takes precedence over every other kind, so a rule method is never a command.
  is.aggregate-invariant-method:
    all:
      - matches: is.aggregate-method
      - has: { stopBy: end, kind: if_statement, has: { stopBy: end, kind: throw_statement } }

  # A FACTORY: the static creation method — creation, not a state read.
  is.aggregate-factory-method:
    all:
      - matches: is.aggregate-method
      - has: { stopBy: neighbor, kind: modifiers, regex: '\bstatic\b' }

  # A PROJECTION: an aggregate method that returns state — a snapshot (`to<Type>`)
  # transformation or a query answering a question (`is…`/`can…`), one category.
  is.aggregate-projection-method:
    all:
      - matches: is.aggregate-method
      - not: { matches: is.aggregate-invariant-method }
      - not: { matches: is.aggregate-factory-method }
      - not: { has: { field: type, stopBy: neighbor, kind: void_type } }

  # A COMMAND HANDLER: a non-private aggregate method that changes state through a
  # business operation and returns nothing.
  is.aggregate-command-method:
    all:
      - matches: is.aggregate-method
      - not: { matches: is.aggregate-invariant-method }
      - not: { matches: is.aggregate-factory-method }
      - not: { matches: is.aggregate-projection-method }
      - not: { has: { stopBy: neighbor, kind: modifiers, regex: '\bprivate\b' } }

  # UNCLASSIFIED: a private helper that neither projects, creates, nor enforces an
  # invariant — the residual bucket.
  is.aggregate-unclassified-method:
    all:
      - matches: is.aggregate-method
      - not: { matches: is.aggregate-invariant-method }
      - not: { matches: is.aggregate-factory-method }
      - not: { matches: is.aggregate-projection-method }
      - not: { matches: is.aggregate-command-method }

  # --- Shared visibility predicates ----------------------------------------
  # `stopBy: neighbor` reads the type's / member's OWN modifiers (utils are
  # exempt from the check-level `has: stopBy: end` rule), so a nested type or a
  # called method never leaks into the outer type's verdict.

  # The node's own modifiers carry `public`.
  has.public-modifier:
    has: { stopBy: neighbor, kind: modifiers, regex: '\bpublic\b' }

  # The class itself is `public`.
  is.public:
    all:
      - kind: class_declaration
      - matches: has.public-modifier

  # The type's own body declares any public member (field, method, constructor,
  # nested type). Used where full encapsulation is required (aggregate, controller).
  has.public-member:
    has:
      field: body
      stopBy: neighbor
      kind: class_body
      has:
        stopBy: neighbor
        any:
          - kind: field_declaration
          - kind: method_declaration
          - kind: constructor_declaration
          - kind: class_declaration
          - kind: interface_declaration
          - kind: enum_declaration
          - kind: record_declaration
          - kind: annotation_type_declaration
        has: { stopBy: neighbor, kind: modifiers, regex: '\bpublic\b' }

  # The type's own body declares a public field. Used where methods must stay
  # public (interface `@Override`, Spring listeners) but fields must not.
  has.public-field:
    has:
      field: body
      stopBy: neighbor
      kind: class_body
      has:
        stopBy: neighbor
        kind: field_declaration
        has: { stopBy: neighbor, kind: modifiers, regex: '\bpublic\b' }

  # A POLICY — a stateless business-calculation object (`domain-model-policy.md`):
  # the rules record and its rule types, named `*Calculation` or `*Decision` in the
  # current vocabulary. Never leaves its context, `public` or not.
  is.policy:
    all:
      - any:
          - { kind: class_declaration }
          - { kind: record_declaration }
      - has: { field: name, stopBy: neighbor, kind: identifier, regex: '(Policy|Calculation|Decision)$' }

  # A CONTEXT EXCEPTION — the one unchecked type a bounded context raises
  # (`error-handling.md`). Named by suffix, so the classifier needs no annotation
  # and no path.
  is.exception:
    all:
      - kind: class_declaration
      - has: { field: name, stopBy: neighbor, kind: identifier, regex: 'Exception$' }

  # The ERROR ENUM a context exception nests: it owns the message template, so no
  # caller matches on a message string and no domain error needs its own class.
  has.error-enum:
    has:
      field: body
      stopBy: neighbor
      kind: class_body
      has:
        stopBy: neighbor
        kind: enum_declaration
        has: { field: name, stopBy: neighbor, kind: identifier, regex: '^Error$' }

  # A DOMAIN TYPE — a value object or an aggregate: the model shapes that carry a
  # truth value, as opposed to an adapter that maps one.
  is.domain-type:
    any:
      - { matches: is.valueobject }
      - { matches: is.aggregate }

  # A CONTEXT FACADE — a `public *Service`: the whole entry point of a context. A
  # package-private service is internal and never crosses the context boundary.
  is.context-facade:
    all:
      - matches: is.service
      - matches: has.public-modifier

  # AN EXPOSED CONTRACT: what one bounded context may legitimately reach in
  # another — a `public` model type (event payload, read model, value object), a
  # port interface, a domain event, or a context facade. Everything else in a
  # context is internal; an aggregate and a policy never are.
  is.exposed-contract:
    any:
      - all:
          - { matches: is.model }
          - { matches: has.public-modifier }
      - { matches: is.port }
      - { matches: is.domain-event }
      - { matches: is.context-facade }

  # --- Adapter classifications ---------------------------------------------

  # An HTTP controller — a class carrying `@RestController`.
  is.controller:
    all:
      - kind: class_declaration
      - has:
          stopBy: neighbor
          kind: modifiers
          has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^RestController$' } }

  # A persistence adapter — a class carrying `@Repository`.
  is.repository:
    all:
      - kind: class_declaration
      - has:
          stopBy: neighbor
          kind: modifiers
          has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^Repository$' } }

  # A JPA entity — a class carrying `@Entity`.
  is.jpa-entity:
    all:
      - kind: class_declaration
      - has:
          stopBy: neighbor
          kind: modifiers
          has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^Entity$' } }

  # A projection — a `@Component` class with at least one `@EventListener` method.
  is.projection:
    all:
      - kind: class_declaration
      - has:
          stopBy: neighbor
          kind: modifiers
          has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^Component$' } }
      - has:
          stopBy: end
          kind: method_declaration
          has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^EventListener$' } }

  # --- Architecture role predicates (name suffixes) -------------------------
  # The role is read from the type's SIMPLE NAME, not its annotations, so a plain
  # `class DeviceNormalizingRepository` with no `@Repository` is still an adapter.
  # An adapter is always a concrete type — a `*Repository` interface is the PORT,
  # not the adapter, so interfaces are kept out of `is.adapter`. Each predicate
  # reads its declaration's own name (`stopBy: neighbor`), so a member never
  # classifies.

  # A DOMAIN EVENT is a top-level interface whose name ends in `Event` —
  # `DomainEvent`, `LegacyDomainEvent`. The `Event` suffix is unrelated to the
  # adapter suffixes; naming it first keeps it disjoint from a port below.
  is.domain-event:
    all:
      - kind: interface_declaration
      - matches: is.top-level
      - has: { field: name, stopBy: neighbor, kind: identifier, regex: 'Event$' }

  # A DOMAIN-EVENT TYPE: a domain-event interface that declares the nested event
  # payloads. A normalisation interface (`LegacyDomainEvent`) declares none, so it
  # is not a payload container and carries no polymorphic JSON mapping.
  is.domain-event-type:
    all:
      - matches: is.domain-event
      - has:
          field: body
          stopBy: neighbor
          kind: interface_body
          has: { stopBy: neighbor, kind: record_declaration }

  # An EVENT RECORD: a record nested directly in a domain-event interface — the
  # event payloads, one nested record per event type.
  is.event-record:
    all:
      - kind: record_declaration
      - inside: { stopBy: neighbor, kind: interface_body, inside: { stopBy: neighbor, matches: is.domain-event } }

  # A PORT is a top-level interface that is not a domain event — the boundary the
  # context exposes. Nested interfaces (Spring Data `CrudRepository` extensions
  # declared inside an adapter) are infrastructure internals, so `is.top-level`
  # excludes them.
  is.port:
    all:
      - kind: interface_declaration
      - matches: is.top-level
      - not: { matches: is.domain-event }

  is.adapter:
    all:
      - any:
          - { kind: class_declaration }
          - { kind: record_declaration }
          - { kind: enum_declaration }
      - has: { field: name, stopBy: neighbor, kind: identifier, regex: '(Controller|Repository|Projection|Entity|Integration|Listener|Client)$' }

  is.service:
    all:
      - any:
          - { kind: class_declaration }
          - { kind: interface_declaration }
          - { kind: record_declaration }
          - { kind: enum_declaration }
      - has: { field: name, stopBy: end, kind: identifier, regex: 'Service$' }

  # A MEDIATOR — the cross-context orchestrator (`adapter-mediator.md`): an adapter,
  # never domain. Named by role, so the `mediators` package needs no path rule.
  is.mediator:
    all:
      - any:
          - { kind: class_declaration }
          - { kind: record_declaration }
      - has: { field: name, stopBy: neighbor, kind: identifier, regex: 'Mediator$' }

  # INFRASTRUCTURE — a Spring `@Configuration` class: wiring, not domain. It never
  # carries business rules, so no domain rule applies to it.
  is.infrastructure:
    all:
      - kind: class_declaration
      - has:
          stopBy: neighbor
          kind: modifiers
          has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^Configuration$' } }

  is.model:
    all:
      - any:
          - { kind: class_declaration }
          - { kind: interface_declaration }
          - { kind: record_declaration }
          - { kind: enum_declaration }
      - not:
          any:
            - { matches: is.adapter }
            - { matches: is.service }
            - { matches: is.port }
            - { matches: is.domain-event }
            - { matches: is.mediator }
            - { matches: is.infrastructure }

  # A controller-nested transport object (request/response payload). Like a value
  # object, but scoped to a controller and required to be non-public.
  is.controller-dto:
    all:
      - kind: record_declaration
      - inside: { stopBy: end, matches: is.controller }

  # A controller handler: a method in a controller's own body carrying a Spring
  # mapping annotation (`*Mapping`).
  is.handler:
    all:
      - kind: method_declaration
      - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.controller } }
      - has:
          stopBy: neighbor
          kind: modifiers
          has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: 'Mapping$' } }

  # A handler's path string — positional (`@GetMapping("/x")`) or the value of a
  # `path =` / `value =` pair. Never a `consumes`/`produces` media type.
  is.path-literal:
    all:
      - kind: string_literal
      - any:
          - inside:
              stopBy: neighbor
              kind: annotation_argument_list
              inside: { stopBy: neighbor, kind: annotation, has: { field: name, stopBy: end, kind: identifier, regex: 'Mapping$' } }
          - inside:
              stopBy: neighbor
              kind: element_value_pair
              has: { field: key, stopBy: end, kind: identifier, regex: '^(path|value)$' }

  # A path written positionally (`@GetMapping("/x")`) rather than named (`path = "/x"`).
  is.positional-path-literal:
    all:
      - kind: string_literal
      - inside:
          stopBy: neighbor
          kind: annotation_argument_list
          inside: { stopBy: neighbor, kind: annotation, has: { field: name, stopBy: end, kind: identifier, regex: 'Mapping$' } }

metrics:
  # An aggregate is small by contract; every other method gets the policy band.
  # A metric entry filter is evaluated on the element node of the metric's own
  # grain — a callable here — so the aggregate predicate is applied as an
  # enclosing type (`inside`), not as the bare `matches: is.aggregate` (a class).
  cyclomatic_complexity:
    - filter:
        all:
          - kind: method_declaration
          - inside: { stopBy: end, matches: is.aggregate }
      warning: 4
      error: 5
    - warning: 12
      error: 15
  # A controller handler carries its OpenAPI documentation in annotations, and an
  # annotation line is not a statement: `@PostMapping` + `@Operation` with a split
  # description already costs ~7 of the 15 lines. The band is widened by exactly
  # that, so the gate still measures the handler body. `method_body_lines`
  # (sqt#335) removes the need for the offset.
  method_lines:
    - filter:
        all:
          - kind: method_declaration
          - inside: { stopBy: end, matches: is.controller }
      warning: 22
      error: 32
    - warning: 15
      error: 25
  # Parameter limits are global to every method and never apply to a constructor.
  # `parameter_count` measures callables — a constructor is one — so the filter
  # keeps constructors out.
  parameter_count:
    - filter: { kind: method_declaration }
      error: 5
  # Statements per element, one band per role the playbooks measure:
  # `http.thin-controller` and `port.primary-thin` (handler, service method),
  # `aggregate.method-size`, `projection.handler-thin`, `mediator.body-size` and
  # `persistence.port-method-size`. `warning` reports, only `error` gates.
  function_statements:
    - filter:
        all:
          - kind: method_declaration
          - matches: is.handler
      warning: 5
      error: 10
    - filter:
        all:
          - kind: method_declaration
          - inside: { stopBy: end, matches: is.service }
      warning: 5
      error: 10
    - filter:
        all:
          - kind: method_declaration
          - inside: { stopBy: end, matches: is.aggregate }
      warning: 7
      error: 14
    - filter:
        all:
          - kind: method_declaration
          - inside: { stopBy: end, matches: is.projection }
      warning: 4
      error: 8
    - filter:
        all:
          - kind: method_declaration
          - inside: { stopBy: end, matches: is.mediator }
      warning: 2
      error: 4
    # The two port methods of a persistence adapter are the mapping itself, so
    # the band covers them by name; the private mappers stay unbounded.
    - filter:
        all:
          - kind: method_declaration
          - has: { field: name, stopBy: end, kind: identifier, regex: '^(get|save)$' }
          - inside: { stopBy: end, matches: is.repository }
      warning: 8
      error: 16
  # A handler and a service method are a pass-through: the width of the band is
  # the number of collaborators a use case may have, not a place to compute.
  method_logical_lines:
    - filter:
        all:
          - kind: method_declaration
          - matches: is.handler
      warning: 15
      error: 30
    - filter:
        all:
          - kind: method_declaration
          - inside: { stopBy: end, matches: is.service }
      warning: 15
      error: 30

checks:
  # >3 primitive/String params. A metric counts every parameter, so the
  # primitive-only subset is a check: `nthChild.ofRule` counts *matching* named
  # siblings, so position 4 means a fourth parameter whose type is simple.
  - id: simple-parameter-count
    language: Java
    severity: error
    message: methods must not take more than 3 primitive/String parameters
    rule:
      all:
        - kind: method_declaration
        - has:
            stopBy: end
            all:
              - kind: formal_parameter
              - nthChild:
                  position: 4
                  ofRule:
                    all:
                      - kind: formal_parameter
                      - has:
                          field: type
                          stopBy: end
                          regex: '^(byte|short|int|long|char|float|double|boolean|Byte|Short|Integer|Long|Character|Float|Double|Boolean|String)$'
                          not:
                            inside: { stopBy: end, kind: generic_type }

  # ==================== Shared: JPA entities ====================
  # A JPA entity never escapes its repository/projection file.
  - id: entity.nested
    language: Java
    severity: error
    message: a JPA @Entity must be nested — never exposed at the top level
    filter: { matches: is.jpa-entity }
    rule: { matches: is.top-level }

  # ==================== Shared: model ====================
  # domain-model-value-object.md / domain-model-events.md — a nullable `Boolean` is
  # read as a truth value (`x != null && x`), never compared to a literal: `==`/
  # `!=` on a boxed value compares references, and a null unboxes to an NPE.
  # The domain types named here are the shapes that carry a truth value; an adapter
  # that maps one is out of scope.
  - id: model.no-boxed-boolean-compare
    language: Java
    severity: error
    message: a boxed Boolean is read as a truth value (x != null && x), never compared with ==, != or to Boolean.TRUE / Boolean.FALSE
    filter: { matches: is.domain-type }
    rule:
      any:
        - has:
            stopBy: end
            all:
              - kind: binary_expression
              - has: { field: operator, stopBy: end, regex: '^(==|!=)$' }
              - has: { stopBy: end, regex: '^Boolean[.](TRUE|FALSE)$' }
        - has:
            stopBy: end
            all:
              - kind: method_invocation
              - has: { field: name, stopBy: end, kind: identifier, regex: '^equals$' }
              - has: { field: object, stopBy: end, kind: field_access, regex: '^Boolean[.](TRUE|FALSE)$' }

  # ==================== Errors ====================
  # error-handling.md — one unchecked exception per bounded context, carrying the
  # error type, the message and the domain values instead of a hierarchy of classes.
  - id: error.unchecked-per-context
    language: Java
    severity: error
    message: a *Exception of a bounded context must extend RuntimeException (error-handling.md)
    filter: { matches: is.exception }
    rule:
      not:
        has:
          stopBy: end
          all:
            - kind: superclass
            - has: { stopBy: end, kind: type_identifier, regex: '^RuntimeException$' }

  - id: error.type-enum-nested
    language: Java
    severity: error
    message: a context exception must nest an `enum Error` that owns the message (error-handling.md)
    filter: { matches: is.exception }
    rule: { not: { matches: has.error-enum } }

  # error-handling.md — the aggregate raises the context's own failure type. A JDK
  # exception carries no domain error, so a caller has to match on a message.
  - id: error.domain-throws-context-type
    language: Java
    severity: error
    message: an aggregate must throw its context exception, never a JDK exception (error-handling.md)
    filter: { matches: is.aggregate }
    rule:
      has:
        stopBy: end
        all:
          - kind: throw_statement
          - has:
              stopBy: end
              kind: type_identifier
              regex: '^(IllegalArgumentException|IllegalStateException|RuntimeException|UnsupportedOperationException)$'

  # ==================== Domain: aggregate ====================
  # domain-model.md
  - id: aggregate.package-private
    language: Java
    severity: error
    message: an aggregate must be package-private
    filter: { matches: is.aggregate }
    rule: { matches: is.public }

  - id: aggregate.no-public-members
    language: Java
    severity: error
    message: an aggregate must not expose public members
    filter: { matches: is.aggregate }
    rule: { matches: has.public-member }

  - id: aggregate.static-factory-method
    language: Java
    severity: error
    message: an aggregate must declare a static factory method returning its own type
    filter: { matches: is.aggregate }
    rule:
      all:
        - matches: is.aggregate
        - has: { field: name, stopBy: end, pattern: $NAME }
        - not:
            has:
              stopBy: end
              all:
                - kind: method_declaration
                - has: { stopBy: end, kind: modifiers, regex: '\bstatic\b' }
                - has: { field: type, stopBy: end, kind: type_identifier, pattern: $NAME }

  # domain-model.md — "Instance fields are private; id and events may be final".
  # A non-final field must be `private` (final invariants may be package-private);
  # `aggregate.no-public-members` bans public fields of any kind on top of this.
  - id: aggregate.nonfinal-fields-private
    language: Java
    severity: error
    message: an aggregate's non-final fields must be private
    filter: { matches: is.aggregate }
    rule:
      has:
        stopBy: end
        all:
          - kind: field_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.aggregate } }
          - not: { has: { stopBy: end, kind: modifiers, regex: '\b(final|static)\b' } }
          - not: { has: { stopBy: end, kind: modifiers, regex: '\bprivate\b' } }

  # domain-model.md NOGO — "Do not add getters like getOwnership()".
  - id: aggregate.no-getters
    language: Java
    severity: error
    message: an aggregate must not declare getters
    filter: { matches: is.aggregate }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.aggregate } }
          - has: { field: name, stopBy: end, kind: identifier, regex: '^get[A-Z]' }

  # domain-model.md — all mutations go through named business methods, not setters.
  - id: aggregate.no-setters
    language: Java
    severity: error
    message: an aggregate must not declare setters
    filter: { matches: is.aggregate }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.aggregate } }
          - has: { field: name, stopBy: end, kind: identifier, regex: '^set[A-Z]' }

  # domain-model.md Shape — "Business name, no Aggregate suffix".
  - id: aggregate.no-name-suffix
    language: Java
    severity: error
    message: an aggregate must be named after the business term, without an Aggregate suffix
    filter: { matches: is.aggregate }
    rule: { has: { field: name, stopBy: end, kind: identifier, regex: 'Aggregate$' } }

  # domain-model.md — "the constructor assigns every instance field and is also how
  # the aggregate is recreated from the database".
  - id: aggregate.all-args-constructor
    language: Java
    severity: error
    message: an aggregate must assign every field in its constructor via @AllArgsConstructor
    filter: { matches: is.aggregate }
    rule:
      not:
        has:
          stopBy: end
          any: [ { kind: annotation }, { kind: marker_annotation } ]
          has: { field: name, stopBy: end, kind: identifier, regex: '^AllArgsConstructor$' }

  # domain-model.md Read paths — a projection transforms (`to<Type>`) or answers a
  # question (`is…`/`can…`); handing out a raw field is a getter whatever its name.
  - id: aggregate.no-raw-field-accessor
    language: Java
    severity: error
    message: an aggregate method must not return a raw field — transform it (`to<Type>`) or answer a question (`is…`/`can…`)
    filter: { matches: is.aggregate-method }
    rule:
      has:
        stopBy: end
        all:
          - kind: block
          - has:
              stopBy: neighbor
              kind: return_statement
              has: { stopBy: end, any: [ { kind: identifier }, { kind: field_access } ] }
          - not:
              has:
                stopBy: end
                any: [ { kind: local_variable_declaration }, { kind: method_invocation }, { kind: if_statement } ]

  # domain-model.md Protected rules — an invariant is a private rule method.
  - id: aggregate.invariant-private
    language: Java
    severity: error
    message: an aggregate's invariant method must be private
    filter: { matches: is.aggregate-invariant-method }
    rule:
      not: { has: { stopBy: end, kind: modifiers, regex: '\bprivate\b' } }

  # domain-model.md — "Every meaningful state change emits a DomainEvent".
  # A method that mutates state (`this.x = …`) must also append to `events`.
  # Delegating methods (no field assignment) are exempt; local assignments are ignored.
  - id: aggregate.mutation-emits-event
    language: Java
    severity: error
    message: an aggregate method that mutates state must emit a domain event
    filter: { matches: is.aggregate }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.aggregate } }
          - has:
              stopBy: end
              all:
                - kind: assignment_expression
                - has: { field: left, stopBy: end, kind: field_access }
          - not:
              has:
                stopBy: end
                all:
                  - kind: method_invocation
                  - has: { field: name, stopBy: end, kind: identifier, regex: '^add$' }
                  - has: { field: object, stopBy: end, kind: identifier, regex: '[Ee]vents$' }

  # ==================== Domain: value object ====================
  # domain-model.md

  # domain-model.md — "records-only is the instruction; a Lombok @Value class is
  # acceptable but not recommended".
  - id: vo.prefer-record
    language: Java
    severity: hint
    message: prefer a record for a value object; a Lombok @Value class is acceptable but not recommended
    filter:
      all:
        - kind: class_declaration
        - has: { stopBy: end, pattern: '@Value' }
    rule: { kind: class_declaration }

  # NOGO JPA annotations on a value object (map them in the adapter).
  - id: vo.no-jpa-annotations
    language: Java
    severity: error
    message: a value object must not carry JPA annotations
    filter: { matches: is.valueobject }
    rule:
      has:
        stopBy: end
        all:
          - any: [ { kind: annotation }, { kind: marker_annotation } ]
          - has: { field: name, stopBy: end, kind: identifier, regex: '^(Entity|Table|Embeddable|Id|Column|GeneratedValue|Transient|MappedSuperclass|JoinColumn|ManyToOne|OneToMany|OneToOne|ManyToMany|ElementCollection)$' }

  # NOGO mutable state / setters.
  - id: vo.no-setters
    language: Java
    severity: error
    message: a value object must not declare setters
    filter: { matches: is.valueobject }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.valueobject } }
          - has: { field: name, stopBy: end, kind: identifier, regex: '^set[A-Z]' }

  # NOGO plain/mutable fields. A record's state is its components (implicitly
  # final), so its body may hold only static final constants.
  - id: vo.record-fields-static-final
    language: Java
    severity: error
    message: a value-object record body must declare only static final constants
    filter: { matches: is.valueobject }
    rule:
      all:
        - kind: record_declaration
        - has:
            stopBy: end
            all:
              - kind: field_declaration
              - inside: { stopBy: neighbor, kind: class_body }
              - any:
                  - not: { has: { stopBy: end, kind: modifiers, regex: '\bstatic\b' } }
                  - not: { has: { stopBy: end, kind: modifiers, regex: '\bfinal\b' } }

  # "Use @Builder for objects with many optional fields".
  - id: vo.builder-when-wide
    language: Java
    severity: hint
    message: a wide value-object record (>=5 components) should declare @Builder
    filter: { matches: is.valueobject }
    rule:
      all:
        - kind: record_declaration
        - has:
            field: parameters
            stopBy: end
            kind: formal_parameter
            nthChild: { position: 5, ofRule: { kind: formal_parameter } }
        - not:
            has:
              stopBy: end
              all:
                - any: [ { kind: annotation }, { kind: marker_annotation } ]
                - has: { field: name, stopBy: end, kind: identifier, regex: '^Builder$' }

  # ==================== Domain: domain events ====================
  # domain-model.md — "Define each event as a record nested inside the interface".
  - id: event.records-only
    language: Java
    severity: error
    message: an event nested in a domain-event interface must be a record
    filter: { matches: is.domain-event-type }
    rule:
      has:
        stopBy: end
        all:
          - inside: { stopBy: neighbor, kind: interface_body, inside: { stopBy: neighbor, matches: is.domain-event } }
          - kind: class_declaration

  # domain-model.md — "Each event record must include the aggregate ID".
  - id: event.carries-id
    language: Java
    severity: error
    message: an event record must carry the aggregate id
    filter: { matches: is.event-record }
    rule:
      not:
        has:
          field: parameters
          stopBy: end
          kind: formal_parameter
          has: { field: name, stopBy: end, kind: identifier, regex: '[Ii]d$' }

  # domain-model.md — "Events are named in past tense".
  - id: event.past-tense
    language: Java
    severity: hint
    message: an event record must be named in past tense (OwnershipUpdated, not UpdateOwnership)
    filter: { matches: is.event-record }
    rule:
      not: { has: { field: name, stopBy: end, kind: identifier, regex: '(ed|Reset)$' } }

  # domain-model.md — "Use @JsonTypeInfo + @JsonSubTypes for polymorphic JSON".
  - id: event.polymorphic-json
    language: Java
    severity: hint
    message: a domain-event interface must carry @JsonTypeInfo and @JsonSubTypes
    filter: { matches: is.domain-event-type }
    rule:
      any:
        - not: { has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^JsonTypeInfo$' } } }
        - not: { has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^JsonSubTypes$' } } }

  # ==================== Controllers ====================
  # adapter-http-command.md / adapter-http-query.md — thin, package-private,
  # constructor-injected, never transactional.
  - id: controller.package-private
    language: Java
    severity: error
    message: a controller must be package-private
    filter: { matches: is.controller }
    rule: { matches: is.public }

  - id: controller.no-public-members
    language: Java
    severity: error
    message: a controller must not expose public members
    filter: { matches: is.controller }
    rule: { matches: has.public-member }

  - id: controller.required-args-constructor
    language: Java
    severity: error
    message: a controller must inject its collaborators via @RequiredArgsConstructor
    filter: { matches: is.controller }
    rule:
      not:
        has:
          stopBy: end
          any: [ { kind: annotation }, { kind: marker_annotation } ]
          has: { field: name, stopBy: end, kind: identifier, regex: '^RequiredArgsConstructor$' }

  - id: controller.no-transactional
    language: Java
    severity: error
    message: a controller must not be transactional (put it on the projection/service)
    filter: { matches: is.controller }
    rule:
      has:
        stopBy: end
        any: [ { kind: annotation }, { kind: marker_annotation } ]
        has: { field: name, stopBy: end, kind: identifier, regex: '^Transactional$' }

  - id: controller.handlers-package-private
    language: Java
    severity: error
    message: controller handler methods must be package-private
    filter: { matches: is.controller }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.controller } }
          - has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^(Get|Post|Put|Patch|Delete|Request)Mapping$' } }
          - has: { stopBy: end, kind: modifiers, regex: '\b(public|protected|private)\b' }

  # ==================== Repositories ====================
  # adapter-persistence-document.md / adapter-persistence-event-sourcing.md —
  # package-private adapters, nested JPA entities, events published on save.
  # Methods stay public (the port interface), so only fields forbid `public`.
  - id: repository.package-private
    language: Java
    severity: error
    message: a repository adapter must be package-private
    filter: { matches: is.repository }
    rule: { matches: is.public }

  - id: repository.no-public-fields
    language: Java
    severity: error
    message: a repository adapter must not expose public fields
    filter: { matches: is.repository }
    rule: { matches: has.public-field }

  - id: repository.publisher-publishes-on-save
    language: Java
    severity: error
    message: a repository with an ApplicationEventPublisher must publish events in save()
    filter:
      all:
        - matches: is.repository
        - has: { stopBy: end, all: [ { kind: field_declaration }, { has: { field: type, stopBy: end, kind: type_identifier, regex: 'ApplicationEventPublisher$' } } ] }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - has: { field: name, stopBy: end, kind: identifier, regex: '^save$' }
          - not:
              has:
                stopBy: end
                all:
                  - kind: method_invocation
                  - has: { field: name, stopBy: end, kind: identifier, regex: '^publishEvent$' }

  # ==================== Projections ====================
  # adapter-projection.md — package-private, @Transactional, handlers listen,
  # query methods read-only. Methods stay public (listeners / port), so only
  # fields forbid `public`.
  - id: projection.package-private
    language: Java
    severity: error
    message: a projection must be package-private
    filter: { matches: is.projection }
    rule: { matches: is.public }

  - id: projection.no-public-fields
    language: Java
    severity: error
    message: a projection must not expose public fields
    filter: { matches: is.projection }
    rule: { matches: has.public-field }

  - id: projection.class-transactional
    language: Java
    severity: error
    message: a projection must be @Transactional (its handlers run in the publisher's transaction)
    filter: { matches: is.projection }
    rule:
      not:
        has:
          stopBy: end
          any: [ { kind: annotation }, { kind: marker_annotation } ]
          has: { field: name, stopBy: end, kind: identifier, regex: '^Transactional$' }

  - id: projection.handlers-listen
    language: Java
    severity: error
    message: a projection's handle* method must be annotated @EventListener
    filter: { matches: is.projection }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.projection } }
          - has: { field: name, stopBy: end, kind: identifier, regex: '^handle' }
          - not:
              has:
                stopBy: end
                any: [ { kind: annotation }, { kind: marker_annotation } ]
                has: { field: name, stopBy: end, kind: identifier, regex: '^EventListener$' }

  - id: projection.find-methods-readonly
    language: Java
    severity: error
    message: a projection's find* query method must be @Transactional(readOnly = true)
    filter: { matches: is.projection }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.projection } }
          - has: { field: name, stopBy: end, kind: identifier, regex: '^find' }
          - not:
              has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], regex: '.*readOnly\s*=\s*true.*' }

  # ==================== API surface ====================
  # adapter-http-command.md / adapter-http-query.md + docs/index.md — consistent
  # handler shape across every controller.
  - id: api.mapping-declares-path
    language: Java
    severity: error
    message: a handler mapping must declare an explicit path
    filter: { matches: is.controller }
    rule:
      has:
        stopBy: end
        all:
          - matches: is.handler
          - not: { has: { stopBy: end, matches: is.path-literal } }

  - id: api.path-leading-slash
    language: Java
    severity: error
    message: a handler path must start with '/'
    filter: { matches: is.controller }
    rule:
      has: { stopBy: end, matches: is.handler, has: { stopBy: end, matches: is.path-literal, not: { regex: '^"/' } } }

  - id: api.path-kebab-case
    language: Java
    severity: warning
    message: a handler path must be lowercase-kebab (no PascalCase/camelCase segments)
    filter: { matches: is.controller }
    rule:
      has: { stopBy: end, matches: is.handler, has: { stopBy: end, matches: is.path-literal, not: { regex: '^"/[a-z0-9/_.-]*([{][^}]*[}][a-z0-9/_.-]*)*"$' } } }

  - id: api.helpers-private
    language: Java
    severity: warning
    message: a controller's non-handler methods must be private
    filter: { matches: is.controller }
    rule:
      has:
        stopBy: end
        all:
          - kind: method_declaration
          - inside: { stopBy: neighbor, kind: class_body, inside: { stopBy: neighbor, matches: is.controller } }
          - not: { has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: 'Mapping$' } } }
          - not: { has: { stopBy: end, kind: modifiers, regex: '\bprivate\b' } }

  - id: api.no-entity-in-signature
    language: Java
    severity: warning
    message: a controller handler must not reference a JPA *Entity type
    filter: { matches: is.controller }
    rule:
      has: { stopBy: end, matches: is.handler, has: { stopBy: end, kind: type_identifier, regex: 'Entity$' } }

  - id: api.request-body-valid
    language: Java
    severity: error
    message: a @RequestBody parameter must be @Valid
    filter: { matches: is.controller }
    rule:
      has:
        stopBy: end
        all:
          - matches: is.handler
          - has:
              stopBy: end
              all:
                - kind: formal_parameter
                - has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^RequestBody$' } }
                - not: { has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^(Valid|Validated)$' } } }

  - id: api.unsafe-method-has-body
    language: Java
    severity: error
    message: a POST/PUT/PATCH handler must take a @RequestBody
    filter: { matches: is.controller }
    rule:
      has:
        stopBy: end
        all:
          - matches: is.handler
          - has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^(Post|Put|Patch)Mapping$' } }
          - not: { has: { stopBy: end, kind: formal_parameter, has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^RequestBody$' } } } }

  - id: api.get-returns-value
    language: Java
    severity: error
    message: a GET handler must return a value, not void
    filter: { matches: is.controller }
    rule:
      has:
        stopBy: end
        all:
          - matches: is.handler
          - has: { stopBy: end, any: [ { kind: annotation }, { kind: marker_annotation } ], has: { field: name, stopBy: end, kind: identifier, regex: '^GetMapping$' } }
          - has: { field: type, stopBy: end, kind: void_type }

  - id: api.mapping-named-path
    language: Java
    severity: hint
    message: 'declare the path as a named attribute: @*Mapping(path = "…")'
    filter: { matches: is.controller }
    rule:
      has: { stopBy: end, matches: is.handler, has: { stopBy: end, matches: is.positional-path-literal } }

  # Exposes resources, not actions: a path segment must not start with an RPC verb.
  # `search`/`find`/`list` are treated as resource nouns, not verbs.
  - id: api.path-no-rpc-verb
    language: Java
    severity: hint
    message: use a resource-based path (noun) and express the action with the HTTP method — GET /devices, not GET /getDevices
    filter: { matches: is.controller }
    rule:
      has: { stopBy: end, matches: is.handler, has: { stopBy: end, matches: is.path-literal, regex: '(?i)(^|/)(get|create|update|delete|remove|add|fetch|save|process|handle|execute|compute|calculate)([a-z/]|$)' } }

  # ==================== Controller DTOs ====================
  # Transport objects nested in a controller stay non-public; their shape rules
  # are the value-object rules (a controller DTO is a record).
  - id: controller-dto.non-public
    language: Java
    severity: error
    message: a controller-nested transport record must be non-public
    filter: { matches: is.controller-dto }
    rule: { matches: has.public-modifier }

# ==================== Contracts ====================
# context-boundaries.md — a port is the contract one context offers another, so
# its signature carries values: a value object, a record, a collection or a JDK
# type. A write model, an entity, a service, an adapter or a policy in a signature
# makes the caller own the callee's internals.
  - id: contract.value-objects-only
    language: Java
    severity: error
    message: a public port signature carries value objects, records, collections and JDK types — never a write model, entity, service, adapter or policy
    filter:
      all:
        - { kind: interface_declaration }
        - { matches: is.top-level }
        - { matches: has.public-modifier }
    rule:
      has:
        stopBy: end
        kind: type_identifier
        regex: '(Editor|Entity|Service|Repository|Projection|Controller|Calculation|Decision)$'

# ==================== Architecture rules — bounded-context boundaries ====
# One block per bounded context. A context is `devices/configuration/{context}`;
# every context gets the same seven rules, so adding a context means adding a
# block, never inventing a rule.
#
# The roles come from the hexagonal predicates above: an interface is never an
# adapter (`*Repository` is `is.port`), a domain-event interface is
# `is.domain-event`, a `*Mediator` is `is.mediator`, a `@Configuration` class is
# `is.infrastructure`, and `is.model` is the domain centre with all of those
# excluded. A port or a domain event reached from outside the context is not
# flagged — a port exists precisely to be implemented across that boundary.
#
# Exposure is visibility: a model type is reachable from another context only
# when it is declared `public`. Package-private is internal, and no list of
# exposed type names exists to drift.
#
# Forbidden sets only: a rule names positively what it forbids, so whatever it
# cannot name — synthetic symbols, externals — is allowed by default. An
# isolation rule reads `from:` as everything outside the context and `to:` as
# the protected element.
dependencies:
  # ---- device ------------------------------------------------------
  - id: device.adapters-dependencies
    language: java
    severity: error
    message: "a device adapter must not depend on a sibling context"
    from:
      all:
        - { symbol: 'devices/configuration/device/' }
        - { matches: is.adapter }
    to:
      all:
        - any:
            - { symbol: 'devices/configuration/search/' }
            - { symbol: 'devices/configuration/communication/' }
            - { symbol: 'devices/configuration/intervals/' }
            - { symbol: 'devices/configuration/mediators/' }
        - not: [ { matches: is.exposed-contract } ]

  # A service may depend only on its own context, java, lombok and Spring;
  # every other context and every non-Spring library is forbidden.
  - id: device.services-dependencies
    language: java
    severity: error
    message: "a device service must not depend on another context or a non-Spring library"
    from:
      all:
        - { symbol: 'devices/configuration/device/' }
        - { matches: is.service }
    to:
      any:
        - { symbol: 'devices/configuration/tools/' }
        - { symbol: 'devices/configuration/search/' }
        - { symbol: 'devices/configuration/communication/' }
        - { symbol: 'devices/configuration/intervals/' }
        - { symbol: 'devices/configuration/mediators/' }
        - { symbol: 'jakarta/' }
        - { symbol: 'javax/' }
        - { symbol: 'com/fasterxml/' }
        - { symbol: 'org/hibernate/' }
        - { symbol: 'io/micrometer/' }
        - { symbol: 'org/postgresql/' }

  # A model type may depend on other model types and on java, lombok,
  # Jakarta Validation and Jackson; never on an adapter, a service or a
  # framework outside that allow-list. `to:` is global, so a model may
  # reference a sibling context's public model type.
  - id: device.model-dependencies
    language: java
    severity: error
    message: "a device model type must not depend on an adapter, a service or a framework outside the allow-list"
    from:
      all:
        - { symbol: 'devices/configuration/device/' }
        - { matches: is.top-level }
        - { matches: is.model }
    to:
      any:
        - { matches: is.adapter }
        - { matches: is.service }
        - { matches: is.infrastructure }
        - { symbol: 'jakarta/persistence/' }
        - { symbol: 'jakarta/transaction/' }
        - { symbol: 'org/hibernate/' }
        - { symbol: 'org/springframework/' }

  # An adapter is reachable only from its own context.
  - id: device.adapters-isolation
    language: java
    severity: error
    message: "a device adapter may only be accessed from its own context"
    from: { not: [ { symbol: 'devices/configuration/device/' } ] }
    to:
      all:
        - { symbol: 'devices/configuration/device/' }
        - { matches: is.adapter }

  # An internal (package-private) service is reachable only from its own context
  # or by a mediator; a context facade (`public *Service`) stays callable.
  - id: device.services-isolation
    language: java
    severity: error
    message: "an internal device service may only be accessed from its own context or by a mediator"
    from:
      not:
        - { symbol: 'devices/configuration/device/' }
        - { symbol: 'devices/configuration/mediators/' }
    to:
      all:
        - { symbol: 'devices/configuration/device/' }
        - { matches: is.service }
        - not: [ { matches: is.context-facade } ]

  # An aggregate and a policy are the context's own decision rules: never reached
  # from outside, whatever their visibility.
  - id: device.policy-isolation
    language: java
    severity: error
    message: "a device policy may only be used inside its own context"
    from: { not: [ { symbol: 'devices/configuration/device/' } ] }
    to:
      all:
        - { symbol: 'devices/configuration/device/' }
        - { matches: is.policy }

  # A model type is context-private unless it is `public` — the visibility is
  # the contract. No `sharedKernelExposed` list exists: exposing a type means
  # declaring it `public`.
  - id: device.model-isolation
    language: java
    severity: error
    message: "a non-public device model type may only be accessed from its own context"
    from: { not: [ { symbol: 'devices/configuration/device/' } ] }
    to:
      all:
        - { symbol: 'devices/configuration/device/' }
        - { matches: is.model }
        - not: [ { matches: has.public-modifier } ]

  # ---- search ------------------------------------------------------
  - id: search.adapters-dependencies
    language: java
    severity: error
    message: "a search adapter must not depend on a sibling context"
    from:
